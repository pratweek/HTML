<styles>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tables - HTML</title>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      padding: 40px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    table {
      width: 80%;
      margin: 30px auto;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      background-color: white;
    }

    thead {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
    }

    th, td {
      padding: 16px;
      text-align: left;
      font-size: 16px;
    }

    tbody tr {
      border-bottom: 1px solid #eee;
    }

    tbody tr:hover {
      background-color: #f9f9ff;
      transition: background-color 0.3s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>
  <h1>Tables in HTML</h1>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Prateek</td>
        <td>23</td>
        <td>Berlin</td>
      </tr>
      <tr>
        <td>Rohan</td>
        <td>21</td>
        <td>Kolkata</td>
      </tr>
      <tr>
        <td>Shivam</td>
        <td>25</td>
        <td>London</td>
      </tr>
      <tr>
        <td>Utpal</td>
        <td>24</td>
        <td>New York</td>
      </tr>
    </tbody>
  </table>
</body>
</html>

</styles>

<body>
    <h1> Tables in HTML </h1>
    <table> 
        <!-- Head of the table -->
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
                
            </tr>

        </thead>
        <!-- Body of the table -->
        <tbody>
            <tr> 
                <td>Prateek</td>
                <td>23</td>
                <td>Berlin</td>
            </tr>
            <tr>
                <td>Rohan</td>
                <td>21</td>
                <td>Kolakata</td>
            </tr>
            <tr>
                <td>Shivam</td>
                <td>25</td>
                <td>London</td>
            </tr>
            <tr>
                <td>Utpal</td>
                <td>24</td>
                <td>New York</td>
            </tr>
            <tr>
                <td>Thanks</td>  <!-- This cell will span across 1 columns -->
                <td colspan="2">Hello</td> <!-- This cell will span across 2 columns -->
            </tr>

        </tbody>
    </table>
    
</body>
</html>
