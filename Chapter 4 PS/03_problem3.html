<!DOCTYPE html>
<html lang="en">
<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelStud.comv - Book your Travel now </title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> Welcome to TravelStud.com </h1>
    <h2> Book your travel now </h2>
    <form action="https://www.travelstud.com/">
        <div>
            <label for = "name">name</label>
            <input id="name" type="text" placeholder="Enter your name" required>
        </div>
         <br>

        <div>
            <label for ="age">age</label>
            <input id="age" type="number" placeholder="Enter your age" required>
        </div>
        <br>

        <div>
            <label for="phone no">phone</label>
            <input id="phone no" type="phone" placeholder="Enter your phone no" required>
        </div>
        <br>

        <div>
            <label for="address">address</label>
            <textarea name="address" id="address"></textarea>
        </div>
        <br>

        <div>
            <button type="submit">Submit</button>
        </div>
</body>
</html>
