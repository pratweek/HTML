<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Advanced Quick Links</title>
  
</head>
<body>
  <div class="container">
    <div class="card">
      <header>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
          <rect width="24" height="24" rx="6" fill="#6366f1" />
          <path d="M7 12h10M7 8h10M7 16h6" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <div>
          <h1>Advanced Quick Links</h1>
          <p class="lead">A modern, glassmorphism-inspired dashboard of your favorite destinations.</p>
        </div>
      </header>

      <nav class="links" aria-label="popular links">
        <a class="link" href="https://www.google.com" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <path d="M21.6 12.2c0-.7-.1-1.4-.3-2.1H12v4h5.6c-.2 1.2-.8 2.2-1.7 2.9v2.4h2.8c1.6-1.5 2.6-3.6 2.6-6.2z" fill="#4285F4"/>
            <path d="M12 22c2.4 0 4.4-.8 5.9-2.1l-2.8-2.4c-.8.5-1.9.8-3.1.8-2.4 0-4.4-1.6-5.1-3.8H3.9v2.4C5.4 19.8 8.5 22 12 22z" fill="#34A853"/>
            <path d="M6.9 13.5A6.9 6.9 0 0 1 6.6 12c0-.6.1-1.2.3-1.7V7.9H3.9A10 10 0 0 0 2 12c0 1.7.4 3.3 1 4.7l3.9-3.2z" fill="#FBBC05"/>
            <path d="M12 6.1c1.3 0 2.5.5 3.4 1.4l2.6-2.6C16.3 3.5 14.4 2.5 12 2.5 8.5 2.5 5.4 4.7 3.9 7.9l3 2.4c.7-2.2 2.7-3.8 5.1-3.8z" fill="#EA4335"/>
          </svg>
          <span>Google</span>
        </a>

        <a class="link" href="https://www.facebook.com" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <rect width="24" height="24" rx="4" fill="#1877F2"/>
            <path d="M15 8.5h-1.4c-.7 0-1 0-1 1v1.3H15l-.5 2.1H12.6V20h-2.6v-6.1H7.9v-2.1h2.1V10c0-2 1.2-3.1 3-3.1.6 0 1.1 0 1.3.1V8.5z" fill="#fff"/>
          </svg>
          <span>Facebook</span>
        </a>

        <a class="link" href="https://www.instagram.com" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <rect x="2" y="2" width="20" height="20" rx="6" fill="url(#g)" />
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0%" stop-color="#f58529"/>
                <stop offset="50%" stop-color="#dd2a7b"/>
                <stop offset="100%" stop-color="#515bd4"/>
              </linearGradient>
            </defs>
            <path d="M12 7.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6z" fill="#fff" opacity="0.95"/>
            <circle cx="17.6" cy="6.4" r="0.9" fill="#fff"/>
          </svg>
          <span>Instagram</span>
        </a>
      </nav>

      <div class="foot">✨ Save this page as <code>index.html</code> for a beautiful, offline-ready quick links dashboard.</div>
    </div>
  </div>
</body>
</html>
